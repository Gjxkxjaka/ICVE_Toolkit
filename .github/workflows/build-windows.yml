name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          playwright install chromium

      - name: Build
        run: |
          pyinstaller --onedir --name ICVE_Toolkit main.py

      - name: Package
        shell: powershell
        run: |
          Compress-Archive -Path dist\ICVE_Toolkit\* -DestinationPath ICVE_Toolkit-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ICVE_Toolkit-Windows
          path: ICVE_Toolkit-Windows.zip
